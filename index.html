<!doctype html>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Thiago Nunes</title>
<style>
/* Layout: foto de corpo inteiro como fundo, véu escuro para legibilidade, textos e botões centralizados na parte inferior */
:root {
  --overlay-top: rgba(10, 16, 28, 0.15);
  --overlay-bottom: rgba(10, 16, 28, 0.88);
  --fg: #ffffff;
  --muted: rgba(255, 255, 255, 0.82);
  --accent: #c9a25a;
  --card: rgba(255, 255, 255, 0.12);
  --card-border: rgba(255, 255, 255, 0.28);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: #0a101c;
  background-image:
    linear-gradient(180deg, var(--overlay-top) 0%, rgba(10,16,28,0.35) 45%, var(--overlay-bottom) 100%),
    url("foto-thiago.png");
  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: var(--fg);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 40px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}
main { max-width: 460px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header { text-align: center; display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.name { font: 600 28px/1.2 Georgia, "Times New Roman", serif; margin: 0; text-shadow: 0 2px 12px rgba(0,0,0,.45); text-wrap: balance; }
.role { color: var(--accent); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin: 0; }
.creci { color: var(--muted); font-size: 13px; margin: 0; font-variant-numeric: tabular-nums; }
a.card {
  display: flex; align-items: center; gap: 14px;
  background: var(--card);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: var(--fg);
  border: 1px solid var(--card-border); border-radius: 12px;
  padding: 14px 16px; text-decoration: none; min-width: 0;
}
a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
a.card:focus-visible { box-shadow: 0 0 0 3px rgba(201,162,90,.45); }
a.card.primary { background: var(--accent); color: #111; border-color: var(--accent); }
.icon {
  flex: 0 0 40px; height: 40px; border-radius: 10px;
  display: grid; place-items: center;
  background: rgba(255,255,255,.16);
  color: #fff; font-weight: 700; font-size: 13px;
}
a.card.primary .icon { background: rgba(0,0,0,.14); color: #111; }
.text { display: flex; flex-direction: column; min-width: 0; }
.label { font-weight: 600; }
.sub { font-size: 13px; color: var(--muted); }
a.card.primary .sub { color: rgba(17,17,17,.78); }
</style>

<main>
  <header>
    <p class="name">Thiago Nunes</p>
    <p class="role">Corretor de imóveis</p>
    <p class="creci">CRECI-PR 50.265</p>
  </header>

  <a class="card primary" href="https://wa.me/5541998921475" target="_blank" rel="noopener">
    <span class="icon">WA</span>
    <span class="text">
      <span class="label">Falar no WhatsApp</span>
      <span class="sub">Atendimento direto comigo</span>
    </span>
  </a>

  <a class="card" href="https://www.instagram.com/thiago_nunes_corretor" target="_blank" rel="noopener">
    <span class="icon">IG</span>
    <span class="text">
      <span class="label">Instagram</span>
      <span class="sub">@thiago_nunes_corretor</span>
    </span>
  </a>
</main>
